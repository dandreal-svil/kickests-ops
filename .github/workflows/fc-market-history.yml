name: FC Market History

on:
  workflow_dispatch:
  push:
    paths:
      - ".fc-compravendita/run-request.json"
      - "fc-compravendita/futbin-history.py"
      - "fc-compravendita/shortlist.json"
      - ".github/workflows/fc-market-history.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Collect FUTBIN history
        shell: bash
        run: |
          set +e
          rm -rf fc-compravendita/history/latest
          mkdir -p fc-compravendita/history/latest
          python fc-compravendita/futbin-history.py             --shortlist fc-compravendita/shortlist.json             --out fc-compravendita/history/latest             --platform ps
          STATUS=$?
          echo "$STATUS" > fc-compravendita/history/latest/exit-code.txt
          cp .fc-compravendita/run-request.json fc-compravendita/history/latest/run-request.json
          find fc-compravendita/history/latest -type f -name "sales.html" -delete
          exit 0

      - name: Commit collected history
        shell: bash
        run: |
          REQUEST_ID=$(python -c "import json; print(json.load(open('.fc-compravendita/run-request.json', encoding='utf-8'))['request_id'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fc-compravendita/history/latest
          if git diff --cached --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "fc-market-history: ${REQUEST_ID} [skip ci]"
            git push
          fi
