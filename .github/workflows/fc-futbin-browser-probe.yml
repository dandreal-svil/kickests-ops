name: FC FUTBIN Browser Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "fc-compravendita/futbin-browser-probe.py"
      - ".github/workflows/fc-futbin-browser-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe FUTBIN
        run: python fc-compravendita/futbin-browser-probe.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fc-compravendita/history/probe
          git commit -m "fc-futbin-browser-probe result [skip ci]" || exit 0
          git push
