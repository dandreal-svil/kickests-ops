name: KickestOps Auto Acquisition

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | pre-gw | live-turn | opta"
        required: true
        default: "auto"
        type: choice
        options: [auto, pre-gw, live-turn, opta]
      gw:
        description: "GW number or auto"
        required: true
        default: "auto"
      horizon_gws:
        description: "Frozen-origin horizon (1..9)"
        required: true
        default: "3"
  push:
    paths:
      - ".kickestops/run-request.json"

permissions:
  contents: read

concurrency:
  group: kickestops-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KICKEST_BEARER: ${{ secrets.KICKEST_BEARER }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-acquisition.txt

      - name: Restore acquisition cache
        uses: actions/cache@v4
        with:
          path: .kickestops-cache
          key: kickestops-acquisition-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kickestops-acquisition-${{ runner.os }}-

      - name: Resolve run request
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "gw=${{ inputs.gw }}" >> "$GITHUB_OUTPUT"
            echo "horizon=${{ inputs.horizon_gws }}" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY'
          import json, os
          with open(".kickestops/run-request.json", encoding="utf-8") as f:
              r=json.load(f)
          mode=str(r.get("mode","auto"))
          gw=str(r.get("gw","auto"))
          horizon=str(r.get("horizon_gws",3))
          if mode not in {"auto","pre-gw","live-turn","opta"}:
              raise SystemExit(f"invalid mode: {mode}")
          if gw != "auto" and not (gw.isdigit() and 1 <= int(gw) <= 38):
              raise SystemExit(f"invalid gw: {gw}")
          if not (horizon.isdigit() and 1 <= int(horizon) <= 9):
              raise SystemExit(f"invalid horizon_gws: {horizon}")
          out=os.environ["GITHUB_OUTPUT"]
          with open(out,"a",encoding="utf-8") as g:
              g.write(f"mode={mode}\n")
              g.write(f"gw={gw}\n")
              g.write(f"horizon={horizon}\n")
          PY
          fi

      - name: Verify unified entrypoint
        run: python kickestops_auto_acquire.py inspect

      - name: Run unified acquisition
        run: |
          python kickestops_auto_acquire.py "${{ steps.params.outputs.mode }}" \
            --gw "${{ steps.params.outputs.gw }}" \
            --season "2026-27" \
            --horizon-gws "${{ steps.params.outputs.horizon }}" \
            --output-dir artifacts \
            --cache-dir .kickestops-cache

      - name: Upload immutable staging bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kickestops-acquisition-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
