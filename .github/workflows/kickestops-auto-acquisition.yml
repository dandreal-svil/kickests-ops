name: KickestOps Auto Acquisition

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | pre-gw | live-turn | opta | opta-full"
        required: true
        default: "auto"
        type: choice
        options: [auto, pre-gw, live-turn, opta, opta-full]
      gw:
        description: "GW number or auto"
        required: true
        default: "auto"
      horizon_gws:
        description: "Frozen-origin horizon (1..9)"
        required: true
        default: "3"
  push:
    paths:
      - ".kickestops/run-request.json"

permissions:
  contents: read

concurrency:
  group: kickestops-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      KICKEST_BEARER: ${{ secrets.KICKEST_BEARER }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve run request
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
            gw="${{ inputs.gw }}"
            horizon="${{ inputs.horizon_gws }}"
          else
            mode="$(jq -r '.mode // "auto"' .kickestops/run-request.json)"
            gw="$(jq -r '.gw // "auto" | tostring' .kickestops/run-request.json)"
            horizon="$(jq -r '.horizon_gws // 3 | tostring' .kickestops/run-request.json)"
          fi

          case "$mode" in
            auto|pre-gw|live-turn|opta|opta-full) ;;
            *) echo "Invalid mode: $mode" >&2; exit 2 ;;
          esac

          if [ "$gw" != "auto" ]; then
            case "$gw" in
              ''|*[!0-9]*) echo "Invalid gw: $gw" >&2; exit 2 ;;
            esac
            if [ "$gw" -lt 1 ] || [ "$gw" -gt 38 ]; then
              echo "Invalid gw: $gw" >&2
              exit 2
            fi
          fi

          case "$horizon" in
            ''|*[!0-9]*) echo "Invalid horizon_gws: $horizon" >&2; exit 2 ;;
          esac
          if [ "$horizon" -lt 1 ] || [ "$horizon" -gt 9 ]; then
            echo "Invalid horizon_gws: $horizon" >&2
            exit 2
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "gw=$gw" >> "$GITHUB_OUTPUT"
          echo "horizon=$horizon" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-acquisition.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-acquisition.txt

      - name: Validate entrypoint
        run: |
          python -m py_compile kickestops_auto_acquire.py
          python kickestops_auto_acquire.py inspect

      - name: Run acquisition
        run: |
          python kickestops_auto_acquire.py "${{ steps.params.outputs.mode }}" \
            --gw "${{ steps.params.outputs.gw }}" \
            --season "2026-27" \
            --horizon-gws "${{ steps.params.outputs.horizon }}" \
            --output-dir artifacts \
            --cache-dir .kickestops-cache

      - name: Show run manifest
        if: always()
        run: |
          if [ -f artifacts/AUTO_ACQUISITION_RUN.json ]; then
            cat artifacts/AUTO_ACQUISITION_RUN.json
            echo "### KickestOps acquisition" >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/AUTO_ACQUISITION_RUN.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload staging bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kickestops-acquisition-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
