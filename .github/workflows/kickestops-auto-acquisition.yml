name: KickestOps Auto Acquisition

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | pre-gw | live-turn | opta"
        required: true
        default: "auto"
        type: choice
        options: [auto, pre-gw, live-turn, opta]
      gw:
        description: "GW number or auto"
        required: true
        default: "auto"
      horizon_gws:
        description: "Frozen-origin horizon (1..9)"
        required: true
        default: "3"
  push:
    paths:
      - ".kickestops/run-request.json"

permissions:
  contents: read

concurrency:
  group: kickestops-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KICKEST_BEARER: ${{ secrets.KICKEST_BEARER }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-acquisition.txt

      - name: Restore acquisition cache
        uses: actions/cache@v4
        with:
          path: .kickestops-cache
          key: kickestops-acquisition-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kickestops-acquisition-${{ runner.os }}-

      - name: Resolve run request
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
            gw="${{ inputs.gw }}"
            horizon="${{ inputs.horizon_gws }}"
          else
            mode="$(jq -r '.mode // "auto"' .kickestops/run-request.json)"
            gw="$(jq -r '.gw // "auto" | tostring' .kickestops/run-request.json)"
            horizon="$(jq -r '.horizon_gws // 3 | tostring' .kickestops/run-request.json)"
          fi

          case "$mode" in
            auto|pre-gw|live-turn|opta) ;;
            *) echo "Invalid mode: $mode" >&2; exit 2 ;;
          esac

          if [ "$gw" != "auto" ]; then
            case "$gw" in
              ''|*[!0-9]*) echo "Invalid gw: $gw" >&2; exit 2 ;;
            esac
            if [ "$gw" -lt 1 ] || [ "$gw" -gt 38 ]; then
              echo "Invalid gw: $gw" >&2
              exit 2
            fi
          fi

          case "$horizon" in
            ''|*[!0-9]*) echo "Invalid horizon_gws: $horizon" >&2; exit 2 ;;
          esac
          if [ "$horizon" -lt 1 ] || [ "$horizon" -gt 9 ]; then
            echo "Invalid horizon_gws: $horizon" >&2
            exit 2
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "gw=$gw" >> "$GITHUB_OUTPUT"
          echo "horizon=$horizon" >> "$GITHUB_OUTPUT"

      - name: Verify unified entrypoint
        run: python kickestops_auto_acquire.py inspect

      - name: Run unified acquisition
        run: |
          python kickestops_auto_acquire.py "${{ steps.params.outputs.mode }}" \
            --gw "${{ steps.params.outputs.gw }}" \
            --season "2026-27" \
            --horizon-gws "${{ steps.params.outputs.horizon }}" \
            --output-dir artifacts \
            --cache-dir .kickestops-cache

      - name: Upload immutable staging bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kickestops-acquisition-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
